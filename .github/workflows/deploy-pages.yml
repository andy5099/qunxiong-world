name: Deploy 群雄天下 to GitHub Pages

# 靜態遊戲在主要分支更新時自動發布，也可從 GitHub Actions 手動執行。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得遊戲檔案
        if: github.ref != 'refs/heads/agent/blackwind-flipper-prototype-v3-1' && github.ref != 'refs/heads/agent/blackwind-flipper-prototype-v3-2' && github.ref != 'refs/heads/agent/blackwind-flipper-prototype-v3-3'
        uses: actions/checkout@v6
      - name: 取得正式 master 網站
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-1'
        uses: actions/checkout@v6
        with:
          ref: master
          path: site
      - name: 取得 V3.1 Prototype 分支
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-1'
        uses: actions/checkout@v6
        with:
          ref: agent/blackwind-flipper-prototype-v3-1
          path: prototype-source
      - name: 組裝 V3.1 獨立 Preview
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-1'
        run: |
          rm -rf site/prototype-blackwind-v3-1
          cp -R prototype-source/prototype-blackwind-v3-1 site/prototype-blackwind-v3-1
      - name: 取得正式 master 網站（V3.2）
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-2'
        uses: actions/checkout@v6
        with:
          ref: master
          path: site
      - name: 取得 V3.2 Prototype 分支
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-2'
        uses: actions/checkout@v6
        with:
          ref: agent/blackwind-flipper-prototype-v3-2
          path: prototype-source
      - name: 組裝 V3.2 獨立 Preview
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-2'
        run: |
          rm -rf site/prototype-blackwind-v3-2
          cp -R prototype-source/prototype-blackwind-v3-2 site/prototype-blackwind-v3-2
      - name: 取得正式 master 網站（V3.3）
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-3'
        uses: actions/checkout@v6
        with:
          ref: master
          path: site
      - name: 取得 V3.3 Prototype 分支
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-3'
        uses: actions/checkout@v6
        with:
          ref: agent/blackwind-flipper-prototype-v3-3
          path: prototype-source
      - name: 組裝 V3.3 獨立 Preview
        if: github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-3'
        run: |
          rm -rf site/prototype-blackwind-v3-3
          cp -R prototype-source/prototype-blackwind-v3-3 site/prototype-blackwind-v3-3
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳靜態網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ (github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-1' || github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-2' || github.ref == 'refs/heads/agent/blackwind-flipper-prototype-v3-3') && 'site' || '.' }}
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
