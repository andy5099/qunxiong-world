<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0c23">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Astral World：星界冒險</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/alpha-v02.css">
  <link rel="stylesheet" href="css/visual-icons.css">
</head>
<body>
  <main class="phone-shell" id="app">
    <header class="top-panel">
      <button class="portrait" data-action="page" data-page="character" aria-label="角色資訊"><span>星</span></button>
      <div class="level-block"><strong id="playerName">星界冒險者</strong><small>Lv.<b id="level">1</b> 星刃使</small><div class="xp-bar"><i id="xpFill"></i></div></div>
      <div class="currency"><b>✦ <span id="power">0</span></b><b>◈ <span id="gold">0</span></b></div><button class="settings-button" data-action="page" data-page="settings" aria-label="設定">⚙</button>
    </header>

    <section class="screen active" data-screen="battle">
      <div class="battle-meta"><span id="mapName">星光草原</span><span id="stageLabel">1-1</span><button class="boss-button" id="bossButton" data-action="boss">挑戰 Boss</button></div>
      <section class="objective-card" id="objectiveCard"><b id="objectiveTitle">主線目標</b><span id="objectiveText">正在準備星界探索…</span><small id="unlockHint"></small></section>
      <canvas id="battleCanvas" aria-label="星界冒險自動戰鬥畫面"></canvas>
      <section class="combat-readout">
        <div class="life-row"><span>HP</span><div class="meter hp"><i id="playerHp"></i></div><b id="playerHpText">150 / 150</b></div>
        <div class="life-row shield-row"><span>盾</span><div class="meter shield"><i id="playerShield"></i></div><b id="playerShieldText">0</b></div>
        <div class="stage-progress"><span>擊殺 <b id="killProgress">0 / 10</b></span><span id="battleState">自動探索</span></div>
      </section>
      <section class="skills" id="skills"></section>
      <section class="pet-skill-readout" id="petSkillReadout" aria-live="polite"></section>
      <section class="event-log" id="eventLog" aria-live="polite"></section>
    </section>

    <section class="screen" data-screen="character"><div id="characterPage"></div></section>
    <section class="screen" data-screen="equipment"><div id="equipmentPage"></div></section>
    <section class="screen" data-screen="pets"><div id="petsPage"></div></section>
    <section class="screen" data-screen="petCodex"><div id="petCodexPage"></div></section>
    <section class="screen" data-screen="maps"><div id="mapsPage"></div></section>
    <section class="screen" data-screen="inventory"><div id="inventoryPage"></div></section>
    <section class="screen" data-screen="quests"><div id="questsPage"></div></section>
    <section class="screen" data-screen="settings"><div id="settingsPage"></div></section>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="active" data-action="page" data-page="battle"><span>⚔</span>戰鬥</button>
      <button data-action="page" data-page="character"><span>◇</span>角色</button>
      <button data-action="page" data-page="equipment"><span>⬡</span>裝備</button>
      <button data-action="page" data-page="pets"><span>✧</span>寵物</button>
      <button data-action="page" data-page="petCodex"><span>✦</span>圖鑑</button>
      <button data-action="page" data-page="maps"><span>⌁</span>地圖</button>
      <button data-action="page" data-page="inventory"><span>▣</span>背包</button>
      <button data-action="page" data-page="quests"><span>✓</span>任務</button>
    </nav>
    <div class="tutorial-overlay" id="tutorialOverlay" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="modal" id="modal" aria-hidden="true"><div class="modal-card" id="modalCard"></div></div>
  </main>
  <script type="module" src="src/astral-world/main.js"></script>
</body>
</html>
